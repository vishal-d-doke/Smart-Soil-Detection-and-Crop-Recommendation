version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: smart_soil_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: smart_soil_user
      POSTGRES_PASSWORD: smart_soil_password
      POSTGRES_DB: smart_soil
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smart_soil_user -d smart_soil"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smart_soil_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+psycopg://smart_soil_user:smart_soil_password@db:5432/smart_soil
      - SECRET_KEY=replace-with-a-secure-secret-key-in-production
      - CORS_ORIGINS=*
      - APP_DEBUG=false
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=http://localhost:8000
    container_name: smart_soil_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  postgres_data:
